# Dirty fixture workflow: unpinned actions + write-all permissions.
# (Fake workflow for scanner verification only.)
name: CI

on: [push]

permissions: write-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
