# Dirty fixture workflow: top-level permissions block granting write,
# plus one pinned action (must NOT be flagged) and one unpinned action.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
      - run: npm run build
